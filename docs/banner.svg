<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="dsh-monaco — Monaco editor for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101115"/>
      <stop offset="1" stop-color="#1b1d23"/>
    </linearGradient>
    <linearGradient id="glow" x1="360" y1="40" x2="980" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5686fe" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5686fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="340" y1="120" x2="820" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c4da"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="900" cy="90" r="230" fill="url(#glow)"/>

  <!-- editor frame -->
  <g transform="translate(760 58)">
    <rect width="452" height="204" rx="10" fill="#15171b" stroke="#2c2f36"/>
    <rect width="452" height="30" rx="10" fill="#1b1e23"/>
    <rect y="20" width="452" height="10" fill="#1b1e23"/>
    <circle cx="20" cy="15" r="4.5" fill="#3d424b"/>
    <circle cx="36" cy="15" r="4.5" fill="#3d424b"/>
    <circle cx="52" cy="15" r="4.5" fill="#3d424b"/>
    <rect x="16" y="48" width="8" height="8" rx="2" fill="#2f6fd0"/>
    <rect x="38" y="48" width="150" height="8" rx="4" fill="#3a3f49"/>
    <rect x="16" y="72" width="8" height="8" rx="2" fill="#2f6fd0"/>
    <rect x="38" y="72" width="232" height="8" rx="4" fill="#2b2f37"/>
    <rect x="16" y="96" width="8" height="8" rx="2" fill="#2f6fd0"/>
    <rect x="38" y="96" width="96" height="8" rx="4" fill="#8a6a3a"/>
    <rect x="16" y="120" width="8" height="8" rx="2" fill="#2f6fd0"/>
    <rect x="38" y="120" width="186" height="8" rx="4" fill="#2b2f37"/>
    <rect x="16" y="144" width="8" height="8" rx="2" fill="#2f6fd0"/>
    <rect x="38" y="144" width="120" height="8" rx="4" fill="#3a6a55"/>
    <rect x="16" y="168" width="8" height="8" rx="2" fill="#2f6fd0"/>
    <rect x="38" y="168" width="268" height="8" rx="4" fill="#2b2f37"/>
  </g>

  <g transform="translate(84 96)">
    <path d="M0 12 L14 0 L14 92 L40 74 L56 110" stroke="#5686fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <text x="84" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="url(#title)">dsh-monaco</text>
    <text x="84" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#98a2b8">Monaco editor in the DeepSeek Harness right sidebar</text>
    <rect x="84" y="106" width="228" height="30" rx="15" fill="#5686fe" fill-opacity="0.14" stroke="#5686fe" stroke-opacity="0.42"/>
    <text x="102" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8fb0ff">edit · save · version guard</text>
  </g>
</svg>
